name: CI

# Continuous integration gate for status-page. Runs on every push and PR.
# The publish workflow fires only on version tags; keeping this green before
# tagging is the release gate.
#
# Jobs: type-check (vue-tsc) → build (vite) → scan (Trivy filesystem)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  type-check:
    name: Type check (vue-tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run type-check

  build:
    name: Build (vite)
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build

  scan:
    name: Filesystem scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          version: v0.74.0
