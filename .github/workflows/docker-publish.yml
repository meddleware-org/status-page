name: Publish (Docker)
# Release pipeline for status-page. Fires on version tags (v*).
#
# Supply-chain controls:
#   - Multi-arch build (linux/amd64, linux/arm64) via Buildx/QEMU
#   - SBOM (SPDX) + SLSA provenance attached to the image by BuildKit
#   - Keyless cosign signatures (Sigstore Fulcio/Rekor) over the image digest
#   - GitHub-native build-provenance attestation
#   - `latest` is published ONLY for stable (non-pre-release) semver tags
#
# Required repository secrets:
#   QUAY_USERNAME, QUAY_TOKEN, DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# Optional secrets (self-hosted registry, continue-on-error):
#   PRIVATE_REGISTRY_USERNAME, PRIVATE_REGISTRY_TOKEN
# Optional vars (override defaults):
#   QUAY_NAMESPACE, DOCKERHUB_NAMESPACE, PRIVATE_REGISTRY, PRIVATE_NAMESPACE,
#   VITE_API_BASE

on:
  push:
    tags:
      - "v*"

env:
  IMAGE: status-page

permissions:
  contents: read

jobs:
  verify:
    name: Verify (type-check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Type-check
        run: npm run type-check --if-present
      - name: Unit tests
        run: npm run test --if-present

  publish-public:
    name: Publish (quay.io + Docker Hub)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Assert same-origin API base
        run: |
          if [ -n "${{ vars.VITE_API_BASE }}" ]; then
            echo "ERROR: VITE_API_BASE must be empty for public production images (same-origin). Got: ${{ vars.VITE_API_BASE }}"
            exit 1
          fi

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}
            docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Build and push (multi-arch, SBOM + provenance)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit SBOM pulls docker/buildkit-syft-scanner from Docker Hub, whose
          # anonymous OAuth endpoint is unreliable (connection resets). Provenance
          # + cosign signatures + actions/attest-build-provenance already cover
          # supply-chain attestation, matching the split-arch image repos.
          sbom: false
          provenance: mode=max
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE || '' }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}
        run: |
          cosign sign --yes "quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}"
          cosign sign --yes "docker.io/${DOCKERHUB_NS}/${IMAGE}@${DIGEST}"

      # SBOM of the published image, attached as a signed cosign attestation (SPDX JSON).
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: quay.io/${{ vars.QUAY_NAMESPACE }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "docker.io/${DOCKERHUB_NS}/${IMAGE}@${DIGEST}"

      - name: Attest build provenance (quay.io)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          echo "Published & signed @ digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  publish-private:
    name: Publish (self-hosted registry)
    runs-on: ubuntu-latest
    needs: verify
    continue-on-error: true
    permissions:
      contents: read
      id-token: write  # keyless cosign signing (Sigstore Fulcio/Rekor) of the private image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to self-hosted registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.PRIVATE_REGISTRY || 'registry.meddleware.co.uk' }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_TOKEN }}
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.PRIVATE_REGISTRY || 'registry.meddleware.co.uk' }}/${{ vars.PRIVATE_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit SBOM pulls docker/buildkit-syft-scanner from Docker Hub, whose
          # anonymous OAuth endpoint is unreliable (connection resets). Provenance
          # + cosign signatures + actions/attest-build-provenance already cover
          # supply-chain attestation, matching the split-arch image repos.
          sbom: false
          provenance: mode=max
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE || '' }}

      # Keyless cosign signing of the private image. The self-hosted registry is CNCF
      # `distribution` v3, which stores cosign `.sig` OCI artifacts, so the signature is
      # retained alongside the image (parity with the public quay.io/Docker Hub images).
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PRIVATE_REGISTRY: ${{ vars.PRIVATE_REGISTRY || 'registry.meddleware.co.uk' }}
          PRIVATE_NAMESPACE: ${{ vars.PRIVATE_NAMESPACE || 'meddleware-org' }}
        run: |
          cosign sign --yes "${PRIVATE_REGISTRY}/${PRIVATE_NAMESPACE}/${IMAGE}@${DIGEST}"

      - name: Summary
        if: always()
        run: |
          echo "Pushed & signed to private registry @ ${{ vars.PRIVATE_REGISTRY || 'registry.meddleware.co.uk' }}" >> "$GITHUB_STEP_SUMMARY"
